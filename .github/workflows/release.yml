name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify annotated tag
        run: |
          tag="${GITHUB_REF_NAME}"
          type=$(git cat-file -t "$tag")
          if [ "$type" != "tag" ]; then
            echo "::error::Tag '$tag' is not annotated (object type: $type). Re-tag with 'git tag -a $tag -m \"...\"' and push." >&2
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Resolve version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build shadow JAR
        run: gradle --no-daemon shadowJar

      - name: Stage release artifact
        run: |
          mkdir -p release
          cp build/libs/leaf-cli-all.jar \
             "release/leaf-cli-${{ steps.ver.outputs.version }}-all.jar"

      - name: Extract tag message
        id: msg
        run: |
          {
            echo 'body<<TAG_EOF'
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}"
            echo TAG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.msg.outputs.body }}
          files: release/leaf-cli-${{ steps.ver.outputs.version }}-all.jar
          fail_on_unmatched_files: true
