[versions]
kotlin = "2.3.0"
# sk.ainet.core:* and sk.ainet.transformers:* are pinned independently
# because their release lines aren't always lock-stepped.
skainetTransformers = "0.23.3"
skainetCore = "0.23.1"
kotlinxCoroutines = "1.10.2"
kotlinxSerializationJson = "1.9.0"
kotlinxCli = "0.3.6"
shadow = "9.3.1"

[libraries]
# Neutral embedding SPI + adapter. Multiplatform-root coords; Gradle metadata picks the JVM variant.
skainet-transformers-api = { module = "sk.ainet.transformers:skainet-transformers-api", version.ref = "skainetTransformers" }
skainet-transformers-core = { module = "sk.ainet.transformers:skainet-transformers-core", version.ref = "skainetTransformers" }
skainet-transformers-providers = { module = "sk.ainet.transformers:skainet-transformers-providers", version.ref = "skainetTransformers" }
skainet-transformers-inference-bert = { module = "sk.ainet.transformers:skainet-transformers-inference-bert", version.ref = "skainetTransformers" }

# Engine artifacts that LeafEmbedder.kt touches at compile time.
skainet-lang-core = { module = "sk.ainet.core:skainet-lang-core", version.ref = "skainetCore" }
skainet-io-core = { module = "sk.ainet.core:skainet-io-core", version.ref = "skainetCore" }
skainet-io-safetensors = { module = "sk.ainet.core:skainet-io-safetensors", version.ref = "skainetCore" }
skainet-backend-cpu = { module = "sk.ainet.core:skainet-backend-cpu", version.ref = "skainetCore" }

kotlinx-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-cli = { module = "org.jetbrains.kotlinx:kotlinx-cli", version.ref = "kotlinxCli" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }

[plugins]
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
